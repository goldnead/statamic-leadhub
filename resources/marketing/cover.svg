<svg width="1600" height="800" viewBox="0 0 1600 800" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6B5BFF"/>
      <stop offset="0.55" stop-color="#4B33D9"/>
      <stop offset="1" stop-color="#33208F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1300 360) rotate(90) scale(520)">
      <stop stop-color="#9A8BFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9A8BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iconbg" x1="1110" y1="210" x2="1490" y2="590" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C6CFF"/>
      <stop offset="1" stop-color="#4B33D9"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="26" stdDeviation="34" flood-color="#1A0F4D" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#glow)"/>

  <!-- soft decorative funnel watermark, bottom-left -->
  <path d="M-40 470 H300 L170 620 V740 H90 V620 Z" fill="#FFFFFF" fill-opacity="0.05"/>
  <circle cx="1500" cy="120" r="220" fill="#FFFFFF" fill-opacity="0.04"/>

  <!-- ===== LEFT: copy ===== -->
  <!-- eyebrow pill -->
  <rect x="100" y="150" width="430" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.22"/>
  <text x="128" y="180" font-size="19" font-weight="bold" letter-spacing="2.5" fill="#FFFFFF" fill-opacity="0.92">STATAMIC&#160;6&#160;·&#160;CONTROL-PANEL&#160;NATIVE</text>

  <!-- wordmark -->
  <text x="96" y="350" font-size="118" font-weight="bold" letter-spacing="-3" fill="#FFFFFF">Lead<tspan fill="#C9C2FF">Hub</tspan></text>

  <!-- tagline -->
  <text x="102" y="430" font-size="33" font-weight="bold" fill="#EDEBFF" fill-opacity="0.95">Turn Statamic form submissions into contacts,</text>
  <text x="102" y="476" font-size="33" font-weight="bold" fill="#EDEBFF" fill-opacity="0.95">timelines &amp; follow-ups — without a heavyweight CRM.</text>

  <!-- feature pills -->
  <g font-size="22" fill="#FFFFFF" text-anchor="middle">
    <rect x="102" y="540" width="127" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="165" y="569">Contacts</text>
    <rect x="243" y="540" width="127" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="306" y="569">Timeline</text>
    <rect x="384" y="540" width="190" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="479" y="569">Tags &amp; Status</text>
    <rect x="588" y="540" width="152" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="664" y="569">Follow-ups</text>
    <rect x="754" y="540" width="143" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="825" y="569">Pipelines</text>
  </g>

  <!-- handle -->
  <text x="104" y="694" font-family="DejaVu Sans Mono, monospace" font-size="21" fill="#FFFFFF" fill-opacity="0.6">github.com/goldnead/statamic-leadhub</text>

  <!-- ===== RIGHT: the app icon, enlarged ===== -->
  <g filter="url(#shadow)">
    <g transform="translate(1110 210) scale(1.484)">
      <rect width="256" height="256" rx="58" fill="url(#iconbg)"/>
      <!-- incoming submissions -->
      <circle cx="97" cy="60" r="8" fill="#FFFFFF" fill-opacity="0.5"/>
      <circle cx="128" cy="52" r="9" fill="#FFFFFF" fill-opacity="0.85"/>
      <circle cx="159" cy="60" r="8" fill="#FFFFFF" fill-opacity="0.5"/>
      <!-- lead funnel -->
      <path d="M70 88 H186 L142 140 V184 H114 V140 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round"/>
      <!-- qualified contact -->
      <circle cx="128" cy="210" r="7" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
