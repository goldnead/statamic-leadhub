name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · ${{ matrix.stability }} · driver=${{ matrix.driver }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # v0.3 dropped Statamic 5 — the CP layer uses Inertia + Vue 3 + the
        # native @ui components, which only exist in Statamic 6+. Statamic 6
        # itself requires laravel/framework ^12.40|^13.0, so those are the two
        # majors the addon can actually be installed alongside. Laravel 11 is
        # deliberately absent: v11.0.0–v11.55.0 are covered by seven security
        # advisories and Composer refuses the line outright, so a cell for it
        # would test a combination nobody can install.
        php: ['8.2', '8.3', '8.4']
        laravel: ['^12.0', '^13.0']
        stability: [prefer-lowest, prefer-stable]
        driver: [eloquent, flat]
        exclude:
          # Laravel 13 requires PHP ^8.3.
          - php: '8.2'
            laravel: '^13.0'

    env:
      LEADHUB_DRIVER: ${{ matrix.driver }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, dom, fileinfo, sqlite, pdo_sqlite, gd
          coverage: none
          tools: composer:v2

      - name: Determine Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ matrix.laravel }}-${{ matrix.stability }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ matrix.php }}-${{ matrix.laravel }}-${{ matrix.stability }}-
            composer-${{ matrix.php }}-

      - name: Install dependencies
        run: |
          composer update --with-all-dependencies \
            --with "laravel/framework:${{ matrix.laravel }}" \
            --${{ matrix.stability }} --prefer-stable \
            --prefer-dist --no-progress --no-interaction

      # `composer show` accepts at most a package plus a version, so the three
      # names that used to stand here made every one of the 20 matrix cells die
      # with `Too many arguments to "show" command`. Because this step sits in
      # front of the Pest step, the whole suite was skipped rather than run:
      # twenty red cells, none of which had ever executed a single test. A
      # diagnostic step was failing on the line it exists to explain.
      #
      # `--direct` prints exactly the set worth reading — laravel/framework,
      # statamic/cms and goldnead/statamic-brand-context, alongside pest and
      # testbench — as one table, and it cannot be handed a wrong argument. The
      # `grep` went with it: it filtered the `name:`/`versions:` lines of the
      # single-package detail view, which the table form does not emit.
      - name: Show resolved versions
        run: composer show --direct

      - name: Run Pest test suite
        run: vendor/bin/pest --colors=always

  mysql:
    name: MySQL (InnoDB index limits · driver=${{ matrix.driver }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        driver: [eloquent, flat]

    # SQLite has no 3072-byte InnoDB index limit and no utf8mb4 four-bytes-per-
    # character arithmetic, and it reports a broken migration with a different
    # error than MySQL does. phpunit.mysql.xml exists for exactly that second
    # opinion — this job is what finally runs it.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: leadhub_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      LEADHUB_DRIVER: ${{ matrix.driver }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, dom, fileinfo, mysql, pdo_mysql, gd
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -P 3306 --silent && exit 0
            sleep 2
          done
          echo "MySQL never came up" && exit 1

      - name: Run Pest against MySQL
        run: vendor/bin/pest -c phpunit.mysql.xml --colors=always

  style:
    name: Code style (Pint)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - run: composer update --prefer-dist --no-progress --no-interaction

      # Check, never fix. Auto-committing style onto a contributor's branch
      # rewrites their work without asking.
      - run: vendor/bin/pint --test

  static-analysis:
    name: Static analysis (Larastan)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - run: composer update --prefer-dist --no-progress --no-interaction

      # The baseline freezes what src/ already carries; this gate is about
      # everything written after it.
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  webhook-manager-integration:
    name: Webhook Manager integration (live both-addons path)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, dom, fileinfo, sqlite, pdo_sqlite, gd
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      # Pulls in goldnead/statamic-webhook-manager and runs ONLY the Integration
      # suite (the default suite above runs with the addon absent, proving the
      # no-op-when-absent contract). The script works on a throwaway copy, so it
      # never mutates the committed composer.json/lock.
      - name: Run live webhook-manager integration suite
        run: scripts/test-webhook-manager.sh

  notifications-integration:
    name: Notifications integration (live both-addons path)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, dom, fileinfo, sqlite, pdo_sqlite, gd
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      # Pulls in goldnead/statamic-notifications and runs ONLY the Integration
      # suite. Same shape as the job above: the default suite runs with the
      # addon absent so the no-op contract stays honest, and the script works on
      # a throwaway copy of the repo.
      - name: Run live notifications integration suite
        run: scripts/test-notifications.sh
