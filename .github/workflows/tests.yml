name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: PHP ${{ matrix.php }} · Statamic ${{ matrix.statamic }} · driver=${{ matrix.driver }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
        # v0.3 dropped Statamic 5 — the new CP layer uses Inertia + Vue 3 +
        # native @ui components which only exist in Statamic 6+.
        statamic: ['6.*']
        driver: [eloquent, flat]

    env:
      LEADHUB_DRIVER: ${{ matrix.driver }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, dom, fileinfo, sqlite, pdo_sqlite, gd
          coverage: none
          tools: composer:v2

      - name: Determine Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ matrix.statamic }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ matrix.php }}-${{ matrix.statamic }}-
            composer-${{ matrix.php }}-

      - name: Pin Statamic version for this matrix cell
        run: composer require "statamic/cms:${{ matrix.statamic }}" --no-update --no-interaction

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Show installed Statamic / Laravel versions
        run: |
          composer show statamic/cms | grep -E '^(name|versions)'
          composer show laravel/framework | grep -E '^(name|versions)' || true

      - name: Run Pest test suite
        run: vendor/bin/pest --colors=always

  webhook-manager-integration:
    name: Webhook Manager integration (live both-addons path)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, dom, fileinfo, sqlite, pdo_sqlite, gd
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      # Pulls in goldnead/statamic-webhook-manager and runs ONLY the Integration
      # suite (the default suite above runs with the addon absent, proving the
      # no-op-when-absent contract). The script works on a throwaway copy, so it
      # never mutates the committed composer.json/lock.
      - name: Run live webhook-manager integration suite
        run: scripts/test-webhook-manager.sh

  notifications-integration:
    name: Notifications integration (live both-addons path)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, dom, fileinfo, sqlite, pdo_sqlite, gd
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      # Pulls in goldnead/statamic-notifications and runs ONLY the Integration
      # suite. Same shape as the job above: the default suite runs with the
      # addon absent so the no-op contract stays honest, and the script works on
      # a throwaway copy of the repo.
      - name: Run live notifications integration suite
        run: scripts/test-notifications.sh
