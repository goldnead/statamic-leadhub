<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    background: radial-gradient(1200px 700px at 78% 22%, #78350F 0%, #451A03 55%, #1C1917 100%);
    color: #fff; overflow: hidden; position: relative;
  }
  .wrap { display: flex; height: 100%; align-items: center; padding: 0 92px; gap: 64px; }
  .copy { max-width: 660px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 22px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
    color: #FDE68A; margin-bottom: 26px;
  }
  .eyebrow .dot { width: 12px; height: 12px; border-radius: 50%; background: #FBBF24; box-shadow: 0 0 18px #FBBF24; }
  h1 { font-size: 78px; line-height: 1.02; font-weight: 800; letter-spacing: -.02em; }
  h1 .accent { background: linear-gradient(90deg,#FCD34D,#FB923C); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p.sub { margin-top: 28px; font-size: 30px; line-height: 1.35; color: #E7E5E4; font-weight: 400; }
  .badges { margin-top: 40px; display: flex; gap: 14px; }
  .badge { font-size: 22px; font-weight: 600; padding: 12px 22px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); color: #FEF3C7; white-space: nowrap; }
  .art { flex: 1; display: flex; align-items: center; justify-content: center; }
  .glyph { width: 360px; height: 360px; filter: drop-shadow(0 30px 60px rgba(0,0,0,.45)); }
  .corner { position: absolute; right: -120px; bottom: -160px; width: 520px; height: 520px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(249,115,22,.30), transparent 60%); }
</style>
</head>
<body>
  <div class="corner"></div>
  <div class="wrap">
    <div class="copy">
      <span class="eyebrow"><span class="dot"></span>Statamic Addon</span>
      <h1>Statamic<br><span class="accent">LeadHub</span></h1>
      <p class="sub">Turn form submissions into contacts, timelines and follow-ups &mdash; without renting a CRM seat.</p>
      <div class="badges">
        <span class="badge">Contacts</span>
        <span class="badge">Timeline</span>
        <span class="badge">Follow-ups</span>
        <span class="badge">Pipelines</span>
      </div>
    </div>
    <div class="art">
      <svg class="glyph" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
            <stop stop-color="#F59E0B"/><stop offset="1" stop-color="#F97316"/>
          </linearGradient>
          <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#7C2D12" flood-opacity="0.32"/>
          </filter>
        </defs>
        <rect width="512" height="512" rx="112" fill="url(#bg)"/>
        <g filter="url(#sh)">
          <rect x="96" y="136" width="252" height="240" rx="30" fill="#FFFFFF"/>
        </g>
        <circle cx="168" cy="212" r="32" fill="url(#bg)"/>
        <path d="M120 300 C 120 268, 144 250, 168 250 C 192 250, 216 268, 216 300 Z" fill="url(#bg)"/>
        <g fill="url(#bg)" opacity="0.55">
          <rect x="248" y="196" width="76" height="18" rx="9"/>
          <rect x="248" y="228" width="52" height="18" rx="9"/>
        </g>
        <g fill="url(#bg)" opacity="0.35">
          <rect x="120" y="322" width="204" height="16" rx="8"/>
        </g>
        <path d="M406 180 V 348" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity="0.55"/>
        <g fill="#FFFFFF">
          <circle cx="406" cy="184" r="22"/>
          <circle cx="406" cy="264" r="18"/>
          <circle cx="406" cy="344" r="18"/>
        </g>
        <g fill="url(#bg)">
          <circle cx="406" cy="184" r="9"/>
          <circle cx="406" cy="264" r="7"/>
          <circle cx="406" cy="344" r="7"/>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
