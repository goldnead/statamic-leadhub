<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#7C2D12" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- contact card -->
  <g filter="url(#sh)">
    <rect x="96" y="136" width="252" height="240" rx="30" fill="#FFFFFF"/>
  </g>

  <!-- avatar -->
  <circle cx="168" cy="212" r="32" fill="url(#bg)"/>
  <path d="M120 300 C 120 268, 144 250, 168 250 C 192 250, 216 268, 216 300 Z" fill="url(#bg)"/>

  <!-- detail lines -->
  <g fill="url(#bg)" opacity="0.55">
    <rect x="248" y="196" width="76" height="18" rx="9"/>
    <rect x="248" y="228" width="52" height="18" rx="9"/>
  </g>
  <g fill="url(#bg)" opacity="0.35">
    <rect x="120" y="322" width="204" height="16" rx="8"/>
  </g>

  <!-- timeline: the contact's history alongside the card -->
  <path d="M406 180 V 348" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity="0.55"/>
  <g fill="#FFFFFF">
    <circle cx="406" cy="184" r="22"/>
    <circle cx="406" cy="264" r="18"/>
    <circle cx="406" cy="344" r="18"/>
  </g>
  <g fill="url(#bg)">
    <circle cx="406" cy="184" r="9"/>
    <circle cx="406" cy="264" r="7"/>
    <circle cx="406" cy="344" r="7"/>
  </g>
</svg>
